<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'DM Sans', sans-serif; background: #FAF9F6; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
</style>
</head>
<body>
  <div class="w-full h-full bg-[#FAF9F6] border-none shadow-[0_-10px_40px_rgba(0,0,0,0.05)] overflow-hidden relative flex items-center justify-center p-12">
    <!-- Background mock content -->
    <div class="text-gray-300 font-bold text-4xl blur-sm select-none">Goal Tracker Background Content</div>

    <!-- The overlay -->
    <div class="absolute inset-0 z-50 bg-black/60 flex items-center justify-center p-6 backdrop-blur-sm">
       <div class="bg-white rounded-2xl p-8 max-w-md w-full text-center shadow-2xl">
         <h2 class="text-xl font-bold text-[#D25D48] mb-4">Session Expired</h2>
         <p class="text-[#1A1A1A] mb-6 text-sm">For your security, you have been logged out due to inactivity. Please refresh the page to log back in.</p>
         <button class="bg-[#5E8C6A] text-white font-bold rounded-xl px-6 py-3 w-full hover:brightness-90 transition-colors">
           Reload Page
         </button>
       </div>
    </div>
  </div>
</body>
</html>
